version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mental_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mental_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mental_secret_99}
      POSTGRES_DB: ${POSTGRES_DB:-mental_health_db}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mental_user}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mental_redis
    restart: always
    ports:
      - "6380:6379"

  qdrant:
    image: qdrant/qdrant:v1.8.0
    container_name: mental_qdrant
    restart: always
    ports:
      - "6335:6333"

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: mental_backend
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8001:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-mental_user}:${POSTGRES_PASSWORD:-mental_secret_99}@postgres:5432/${POSTGRES_DB:-mental_health_db}
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - postgres
      - redis
      - qdrant

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: mental_frontend
    restart: always
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8001/api/v1
    depends_on:
      - backend
